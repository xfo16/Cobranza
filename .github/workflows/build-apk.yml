name: Compilar APK de Android

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el código del repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Configurar Java JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Instalar dependencias
        run: |
          npm install --legacy-peer-deps

      - name: Compilar proyecto web
        run: |
          npm run build --if-present || true
          if [ ! -d "dist" ] && [ ! -d "build" ] && [ ! -d "public" ]; then
            mkdir -p dist
            echo "<html><body><h1>App Stitch</h1></body></html>" > dist/index.html
          fi

      - name: Configurar e instalar Capacitor
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "AppStitch" "com.miapp.stitch" --web-dir "dist" || true
          npx cap add android || true
          npx cap sync

      - name: Compilar APK con Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Subir el archivo APK
        uses: actions/upload-artifact@v4
        with:
          name: App-Stitch-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
