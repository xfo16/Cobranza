name: Compilar APK de Android

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el código del repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Configurar Java JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Buscar carpeta e instalar dependencias
        run: |
          # Buscar package.json si está en una subcarpeta
          if [ ! -f "package.json" ]; then
            SUBFOLDER=$(find . -maxdepth 2 -name "package.json" -exec dirname {} \;)
            if [ -n "$SUBFOLDER" ]; then
              cd "$SUBFOLDER"
            fi
          fi
          
          npm install --legacy-peer-deps

          # Compilar el proyecto web
          npm run build --if-present

          # Detectar automáticamente qué carpeta de salida generó la compilación
          WEB_DIR="dist"
          if [ -d "build" ]; then WEB_DIR="build"; fi
          if [ -d "out" ]; then WEB_DIR="out"; fi
          if [ -d "public" ]; then WEB_DIR="public"; fi
          
          echo "Carpeta web detectada: $WEB_DIR"

          # Configurar e instalar Capacitor adaptado a la carpeta hallada
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "CobranzaApp" "com.cobranza.app" --web-dir "$WEB_DIR" || true
          
          # Forzar la creación de la plataforma Android
          rm -rf android
          npx cap add android
          npx cap copy android
          npx cap sync android

          # Compilar APK desactivando validaciones estrictas
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace -Pandroid.overridePathCheck=true

      - name: Subir el archivo APK
        uses: actions/upload-artifact@v4
        with:
          name: App-Cobranza-APK
          path: |
            **/android/app/build/outputs/apk/debug/app-debug.apk
