name: Compilar APK de Android

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el código del repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Configurar Java JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Buscar proyecto, preparar index.html e instalar
        run: |
          # 1. Moverse a la carpeta del proyecto si está anidado
          if [ ! -f "package.json" ]; then
            SUBFOLDER=$(find . -maxdepth 2 -name "package.json" -exec dirname {} \;)
            if [ -n "$SUBFOLDER" ]; then
              cd "$SUBFOLDER"
            fi
          fi

          # 2. Corregir la ubicación del index.html para Vite
          if [ ! -f "index.html" ]; then
            SEARCH_INDEX=$(find . -name "index.html" -not -path "*/node_modules/*" | head -n 1)
            if [ -n "$SEARCH_INDEX" ]; then
              echo "index.html encontrado en $SEARCH_INDEX. Moviéndolo a la raíz..."
              cp "$SEARCH_INDEX" ./index.html
            else
              echo "Creando index.html base para la compilación..."
              cat << 'EOF' > index.html
              <!DOCTYPE html>
              <html lang="es">
                <head>
                  <meta charset="UTF-8" />
                  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
                  <title>Cobranzas App</title>
                </head>
                <body>
                  <div id="root"></div>
                  <script type="module" src="/src/main.jsx"></script>
                </body>
              </html>
              EOF
            fi
          fi

          # 3. Instalar dependencias
          npm install --legacy-peer-deps

          # 4. Compilar proyecto web
          npm run build || npx vite build || true

          # 5. Determinar la carpeta de salida generada
          WEB_DIR="dist"
          if [ -d "build" ]; then WEB_DIR="build"; fi
          if [ -d "out" ]; then WEB_DIR="out"; fi

          # Fallback de seguridad si no se creó la carpeta
          if [ ! -d "$WEB_DIR" ]; then
            mkdir -p dist
            cp index.html dist/
            WEB_DIR="dist"
          fi

          # 6. Configurar e integrar Capacitor
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "CobranzasApp" "com.cobranza.app" --web-dir "$WEB_DIR" || true
          
          rm -rf android
          npx cap add android
          npx cap copy android
          npx cap sync android

          # 7. Compilar el APK con Gradle
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Subir el archivo APK
        uses: actions/upload-artifact@v4
        with:
          name: App-Cobranza-APK
          path: |
            **/android/app/build/outputs/apk/debug/app-debug.apk
